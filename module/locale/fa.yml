ai: هوش مصنوعی
diagnostics_group: عیب‌یابی
diagnostics_group_descr: برای آزمایش و عیب‌یابی.
diagnostics_log: ثبت فعالیت گروه‌ها در گزارش
diagnostics_log_details: |-
  هرگاه نیروها به چند گروه تقسیم شوند یا دوباره به هم بپیوندند، یک خط در ucp3.log ثبت می‌کند.

  به‌طور پیش‌فرض خاموش است.
general_group: گروه‌ها
general_group_details: |-
  برای هر دو نوع نیرو اعمال می‌شود.

  کوچک‌ترین اندازهٔ گروه (واحد) — یک دسته نیرو تنها تا جایی تقسیم می‌شود که هر گروه دست‌کم این تعداد واحد داشته باشد.

  پیش‌فرض: 4. هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
general_min_size: کوچک‌ترین اندازهٔ گروه (واحد)
improvements: بهبودها
misc: سایر
patrol_distance: فاصله از قلعه (خانه)
patrol_enabled: اختصاص مسیر جداگانه به هر گروه گشت
patrol_enabled_details: |-
  گروه 1 قلعه را در یک جهت دور می‌زند، گروه 2 در جهت مخالف و گروه 3 در امتداد جبههٔ قلعه (سمت روبه‌روی قلعهٔ مهاجم) رفت‌وآمد می‌کند. گروه‌های 4، 5 و 6 همان کار گروه‌های 1، 2 و 3 را با یک‌چهارم دور فاصله انجام می‌دهند و به همین ترتیب ادامه می‌یابد.

  به‌طور پیش‌فرض روشن است.
patrol_group: نیروهای گشت‌زنی
patrol_group_details: |-
  نیروهای گشت حملهٔ هوش مصنوعی (AttUnitPatrol در فایل هوش مصنوعی). به‌طور عادی تنها اولین گروه گشت حرکت می‌کند و گروه دوم در تمام طول حمله در نقطهٔ تجمع می‌ایستد.

  تعداد گروه‌های گشت — مقدار 0 از تنظیمات خود فایل هوش مصنوعی استفاده می‌کند. بازی به‌تنهایی حداکثر 2 گروه را مدیریت می‌کند؛ این ماژول تا 12 گروه را پشتیبانی می‌کند.

  پیش‌فرض: 0.

  فاصله از قلعه (خانه) — فاصلهٔ حرکت گشت‌ها در بیرون قلعه بر حسب مسافت پیاده‌روی (با دور زدن دیوارها و خندق‌ها). مقدار 12 همان فاصلهٔ گشت اصلی بازی است.

  پیش‌فرض: 12. هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
patrol_groups: تعداد گروه‌های گشت
siegedef_enabled: تقسیم محافظان محاصره به گروه‌های بیشتر
siegedef_enabled_details: |-
  هر گروه کنار یک ابزار محاصرهٔ متفاوت شروع می‌کند و هر گروه دوم در جهت مخالف حرکت می‌کند تا به‌جای حرکت به‌صورت یک تودهٔ واحد، همهٔ ادوات محاصره را پوشش دهند.

  به‌طور پیش‌فرض روشن است.
siegedef_forward: فاصلهٔ جلوتر بودن گروه‌های نزدیک‌زن از ادوات (خانه)
siegedef_group: نیروهای محافظ محاصره
siegedef_group_details: |-
  نیروهایی که از ادوات محاصرهٔ هوش مصنوعی محافظت می‌کنند (AttUnitSiegeDef در فایل هوش مصنوعی). آن‌ها از یک ابزار محاصره به دیگری می‌روند و با آغاز یورش به دیوارها حمله می‌کنند.

  تعداد گروه‌های محافظ محاصره — مقدار 0 از تنظیمات خود فایل هوش مصنوعی استفاده می‌کند. بازی به‌تنهایی حداکثر 2 گروه را مدیریت می‌کند؛ این ماژول تا 12 گروه را پشتیبانی می‌کند.

  پیش‌فرض: 4.

  فاصلهٔ جلوتر بودن گروه‌های نزدیک‌زن از ادوات (خانه) — گروه‌هایی که بیشتر شامل نیروهای نزدیک‌زن هستند به این تعداد خانه نزدیک‌تر به قلعه نسبت به ادوات محاصره می‌ایستند تا مدافعان به‌جای ادوات، به آن‌ها تیر بزنند. کمانداران و دیگر نیروهای دورزن کنار ادوات می‌مانند. مقدار 0 همهٔ گروه‌ها را کنار ادوات نگه می‌دارد.

  پیش‌فرض: 4. هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
siegedef_groups: تعداد گروه‌های محافظ محاصره
