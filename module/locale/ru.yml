ai: ИИ
diagnostics_group: Диагностика
diagnostics_group_descr: Для тестирования.
diagnostics_log: Записывать действия групп в журнал
diagnostics_log_details: |-
  Записывает строку в ucp3.log при разделении войск на группы и при их обратном объединении.

  По умолчанию отключено.
general_group: Группы
general_group_details: |-
  Применяется к обоим видам войск.

  Минимальный размер группы (юнитов) — Отряд делится на группы только до тех пор, пока в каждой группе остаётся не меньше указанного числа юнитов.

  По умолчанию: 4. Используется, если личность ИИ (AIC) не задаёт своё значение.
general_min_size: Минимальный размер группы (юнитов)
improvements: Улучшения
misc: Разное
patrol_distance: Дистанция от замка (клеток)
patrol_enabled: Отдельный маршрут для каждой патрульной группы
patrol_enabled_details: |-
  Группа 1 обходит замок в одну сторону, группа 2 — в другую, группа 3 патрулирует туда-обратно перед фронтом замка (со стороны атакующего). Группы 4, 5 и 6 повторяют маршруты 1, 2 и 3 со смещением на четверть круга, и так далее.

  По умолчанию включено.
patrol_group: Патрульные войска
patrol_group_details: |-
  Атакующие патрули ИИ (AttUnitPatrol в файле ИИ). Обычно двигается только первая патрульная группа, а вторая стоит в точке сбора всю атаку.

  Количество патрульных групп — 0 использует значение из файла ИИ. Сама игра поддерживает не более 2 групп; этот модуль — до 12.

  По умолчанию: 0.

  Дистанция от замка (клеток) — Как далеко от замка ходят патрули, считая по пути обхода (вокруг стен и рвов). 12 — стандартная дистанция игры.

  По умолчанию: 12. Используется, если личность ИИ (AIC) не задаёт своё значение.
patrol_groups: Количество патрульных групп
siegedef_enabled: Разделять осадное прикрытие на большее число групп
siegedef_enabled_details: |-
  Каждая группа начинает у своего осадного орудия, а каждая вторая идёт в противоположном направлении, благодаря чему прикрытие распределяется по всем орудиям вместо движения одной толпой.

  По умолчанию включено.
siegedef_forward: Выдвижение групп ближнего боя перед орудиями (клеток)
siegedef_group: Войска прикрытия осады
siegedef_group_details: |-
  Войска, охраняющие осадные орудия ИИ (AttUnitSiegeDef в файле ИИ). Они переходят от одного осадного орудия к другому и идут на штурм, когда начинается атака на стены.

  Количество групп прикрытия — 0 использует значение из файла ИИ. Сама игра поддерживает не более 2 групп; этот модуль — до 12.

  По умолчанию: 4.

  Выдвижение групп ближнего боя перед орудиями (клеток) — Группы, состоящие в основном из бойцов ближнего боя, держатся на столько клеток ближе к замку, чем орудия, чтобы защитники стреляли по ним, а не по осадным орудиям. Лучники и другие стрелки остаются у орудий. Значение 0 оставляет все группы у орудий.

  По умолчанию: 4. Используется, если личность ИИ (AIC) не задаёт своё значение.
siegedef_groups: Количество групп прикрытия
tags.behavior: Поведение
